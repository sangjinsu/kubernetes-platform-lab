apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-echo
  namespace: lab-chapter-01
  labels:
    app.kubernetes.io/name: lab-echo
    app.kubernetes.io/part-of: chapter-01
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-echo
        app.kubernetes.io/part-of: chapter-01
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args:
            - "-text=hello from chapter 1"
            - "-listen=:5678"
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
